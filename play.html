<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/play.css" />
    <script type="module" src="/src/play.js"></script>
    <title>Let's play Battleship!</title>
  </head>
  <body>
    <main>
      <div class="gameboard-wrap" id="setup-board">
        <div class="gameboard"></div>
      </div>
      <div class="context">
        <div class="img-wrap">
          <img
            class="context-header"
            src="/place_your_ships.png"
            alt="Place your ships"
          />
        </div>
        <div class="controls">
          <div class="tip">
            <img src="/mouse_pointer.png" alt="Press R to rotate" />
            <p>Click to select a ship.</p>
          </div>
          <div class="tip">
            <img src="/rotate_btn.png" alt="Press R to rotate" />
            <div class="p-col">
              <p>Press R on your keyboard to rotate a ship.</p>
              <p>
                Your ship won't rotate if it is too close to the edge of the
                board.
              </p>
            </div>
          </div>
          <div class="tip">
            <img src="/mouse_pointer.png" alt="Press R to rotate" />
            <div class="p-col">
              <p>Move your mouse to where you want to place the ship.</p>
              <p>Click again to drop the ship</p>
            </div>
          </div>
        </div>
        <button class="continue"><img src="/next_button.png" alt="" /></button>
      </div>
      <div class="gameboard-wrap" id="attack-board" hidden>
        <header class="turn-banner">
          <p class="turn"></p>
          <p class="status" aria-live="polite"></p>
        </header>
        <div class="gameboard"></div>
        <p class="turn-popup" hidden>Computer's turn</p>
      </div>
      <aside class="sidebar" hidden>
        <table class="scores">
          <thead>
            <tr>
              <th></th>
              <th>Hits</th>
              <th>Sunk</th>
            </tr>
          </thead>
          <tbody>
            <tr data-player="p1">
              <th></th>
              <td class="hits"></td>
              <td class="sunk"></td>
            </tr>
            <tr data-player="p2">
              <th></th>
              <td class="hits"></td>
              <td class="sunk"></td>
            </tr>
          </tbody>
        </table>
        <div class="mini-map">
          <p>Your fleet</p>
          <div class="gameboard"></div>
        </div>
        <button class="end-turn" hidden>
          <img src="/next_button.png" alt="End turn" />
        </button>
      </aside>
      <dialog id="pass-device">
        <form method="dialog">
          <p></p>
          <button type="submit">
            <img src="/next_button.png" alt="Ready" />
          </button>
        </form>
      </dialog>
      <dialog id="game-over">
        <form method="dialog">
          <p></p>
          <button type="submit">
            <img src="/play_button.png" alt="Play again" />
          </button>
        </form>
      </dialog>
      <dialog open id="choose-players">
        <form method="dialog">
          <div class="name-wrap">
            <label for="name">What is your name?</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Name"
              maxlength="10"
              required
            />
          </div>

          <fieldset>
            <legend>Who do you want to battle?</legend>

            <div class="opponents">
              <input
                type="radio"
                name="opponent"
                id="computer"
                value="computer"
                required
              />
              <label for="computer">Computer</label>

              <input
                type="radio"
                name="opponent"
                id="frienemy"
                value="frienemy"
                required
              />
              <label for="frienemy">Frienemy</label>

              <div class="name-wrap" id="name-2-wrap">
                <input
                  type="text"
                  name="name-2"
                  id="name-2"
                  placeholder="Name"
                  maxlength="10"
                  aria-label="Player two name"
                />
              </div>
            </div>
          </fieldset>
          <button type="submit"><img src="/next_button.png" alt="" /></button>
        </form>
      </dialog>
    </main>
  </body>
</html>
