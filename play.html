<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/play.css" />
    <script type="module" src="/src/play.js"></script>
    <title>Let's play Battleship!</title>
  </head>
  <body>
    <main>
      <div class="gameboard-wrap" id="player-1">
        <div class="gameboard"></div>
      </div>
      <div class="context"></div>
      <dialog open id="choose-players">
        <form method="dialog">
          <div class="name-wrap">
            <label for="name">What is your name?</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Name"
              maxlength="10"
              required
            />
          </div>

          <fieldset>
            <legend>Who do you want to battle?</legend>

            <div class="opponents">
              <input
                type="radio"
                name="opponent"
                id="computer"
                value="computer"
                required
              />
              <label for="computer">Computer</label>

              <input
                type="radio"
                name="opponent"
                id="frienemy"
                value="frienemy"
                required
              />
              <label for="frienemy">Frienemy</label>

              <!-- JS will toggle .two-player here when #frienemy changes.
                   Hard-coded on for now so the layout is visible. -->
              <div class="name-wrap" id="name-2-wrap">
                <input
                  type="text"
                  name="name-2"
                  id="name-2"
                  placeholder="Name"
                  maxlength="10"
                  aria-label="Player two name"
                />
              </div>
            </div>
          </fieldset>

          <button type="submit"><img src="/battle_button.png" alt="" /></button>
        </form>
      </dialog>
    </main>
  </body>
</html>
